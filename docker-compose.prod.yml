# ─────────────────────────────────────────────────────────────────────────────
# Production-SHAPED stack — the reference topology, and the harness used to
# verify that the production image actually boots.
#
# This is NOT `docker-compose.yml` (which stands up bare datastores for local
# development). Everything here runs the way production does:
#   * NODE_ENV=production, so every production fail-fast in
#     src/config/env.validation.ts is active;
#   * the compiled image (`node dist/src/main.js`), never ts-node / watch mode;
#   * migrations as their OWN one-shot unit that must succeed before the API or
#     the worker is allowed to start;
#   * PostgreSQL serving real TLS, so ZT-012 certificate validation is
#     genuinely exercised rather than bypassed;
#   * Redis password-protected, with the queue-durability flags production
#     needs (AOF on, noeviction — this Redis holds job state, not just cache).
#
# WHAT IS STILL LOCAL-ONLY: the datastore containers and the throwaway TLS
# material under deploy/tls. A real deployment points DATABASE_URL and
# REDIS_URL at managed services and supplies their CA — it never runs these two
# containers. Treat the `api`, `worker` and `migrate` service definitions as the
# deployable part and the `postgres`/`redis` ones as a local stand-in.
#
# ── First run ────────────────────────────────────────────────────────────────
#   bash deploy/generate-local-tls.sh
#   cp .env.example .env.production.local     # then fill in real values
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d api worker
#
# ── Migrations only (the deploy-time command) ────────────────────────────────
#   docker compose -f docker-compose.prod.yml run --rm migrate            # run
#   docker compose -f docker-compose.prod.yml run --rm migrate show       # status
#   docker compose -f docker-compose.prod.yml run --rm migrate revert     # undo 1
# ─────────────────────────────────────────────────────────────────────────────

name: ziyarati-prod

# Overrides that are a property of THIS topology, not of the deployment — they
# must not live in the env file, which is meant to mirror what a real platform
# injects. Kept as its own anchor so a service can add one variable (see the
# worker's WORKER_ROLE) without having to restate the whole map.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ziyarati
  REDIS_URL: redis://:localredispassword@redis:6379/0
  DB_SSL_CA: /run/secrets/db-ca.crt

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ziyarati-backend:local
  restart: unless-stopped
  env_file:
    - .env.production.local
  environment: *app-env
  volumes:
    # The CA trust anchor, read-only. On a managed platform this is either a
    # mounted secret (DB_SSL_CA) or an inline PEM variable (DB_SSL_CA_CERT).
    - ./deploy/tls/ca.crt:/run/secrets/db-ca.crt:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ── Local stand-in for the managed PostgreSQL ──────────────────────────────
  postgres:
    build:
      context: ./deploy
      dockerfile: postgres-tls.Dockerfile
    image: ziyarati-postgres-tls:local
    restart: unless-stopped
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ziyarati
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ziyarati']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - prod_postgres_data:/var/lib/postgresql

  # ── Local stand-in for the managed Redis ───────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `noeviction` is deliberate: this Redis holds BullMQ job state, so an
    # eviction policy would silently drop queued work under memory pressure
    # instead of erroring loudly. AOF keeps job state across a restart.
    command:
      - redis-server
      - --requirepass
      - localredispassword
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'localredispassword', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - prod_redis_data:/data

  # ── Migrations: a one-shot unit of work, not a side effect of startup ──────
  # `restart: no` and no long-running process — it exits 0 on success, non-zero
  # on failure, which is exactly what a platform's release/pre-deploy phase (or
  # a Kubernetes Job / ECS one-off task) needs to gate a deploy on.
  #
  # The API also runs pending migrations on boot behind a Postgres advisory
  # lock (src/config/run-migrations-with-lock.ts). Both running is safe and
  # expected: whichever goes first applies them, the other finds none pending.
  migrate:
    <<: *app
    restart: 'no'
    command: ['node', 'dist/src/migrate.js', 'run']
    depends_on:
      postgres:
        condition: service_healthy

  # ── HTTP API ───────────────────────────────────────────────────────────────
  api:
    <<: *app
    # Default CMD from the Dockerfile: node dist/src/main.js
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── BullMQ worker: same image, different entrypoint ────────────────────────
  worker:
    <<: *app
    command: ['node', 'dist/src/worker.js']
    environment:
      <<: *app-env
      # PRODUCTION-MANDATORY on the worker root, and ONLY on the worker root:
      # src/worker.module.ts refuses to boot when it is unset in production
      # rather than silently choosing the unsplit "all" topology. The API
      # deployment must NOT set it — it consumes no queues.
      WORKER_ROLE: all
    # The worker has no HTTP adapter; its only listener is the Prometheus
    # /metrics endpoint on WORKER_METRICS_PORT.
    ports:
      - '${WORKER_METRICS_PORT:-9091}:9091'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "process.exit(0)"
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  prod_postgres_data:
  prod_redis_data:
