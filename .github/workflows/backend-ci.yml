name: Backend CI

# The backend's quality gate.
#
#   - pull_request  -> required check on every PR into master.
#   - workflow_call -> deploy-aws.yml calls this and `deploy-production` WAITS for it, so a
#                      production deploy cannot start from a commit that has not passed it.
#
# Before this workflow existed the only thing between a push and production was `npx jest`
# (deploy-aws.yml); the e2e, security and dependency gates lived in the FRONTEND repo's CI and
# never ran for backend changes. Everything here is real infrastructure (pgvector Postgres 17 +
# Redis 7, the same major versions as production) built from the migration chain — never
# `synchronize` — with no provider credentials: payments are `noop`, email is disabled, and no
# OPENAI_API_KEY is ever set, so no job can reach a live provider.
#
# Branch protection (repo settings, owner): require `static`, `unit`, `e2e` and `security`
# on master. Until then this workflow only reports.

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "infra/**"
      - "compliance/**"
      - "docs/**"
      - "**/*.md"
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "24.22.1" # exact: a bare "24" can resolve to an older cached 24.x; matches the Dockerfile base (2026-10-21 security release)
# The Postgres service image is pgvector/pgvector:pg17 in every job below except the ai-security job's
# default-mode server (plain postgres:17, on purpose — see that job): the AI migrations need the `vector`
# extension, exactly as on RDS (engine_major_version 17 in infra/terraform/environments/production). Each job
# verifies that with scripts/ci/require-pgvector.js BEFORE migrating, so a wrong image fails at once and by
# name, not as a late "extension vector is not available" / missing ai_kb_embeddings spec failure.
# src/config/ci-workflow-pgvector.spec.ts keeps every workflow on this rule. The credentials are for
# disposable CI databases.

jobs:
  # ── Fast checks: nothing here needs a database ─────────────────────────────
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan below needs the commit range

      - name: No credential-bearing files are tracked (state files, saved plans, keys, .env)
        run: |
          bash scripts/ci/check-tracked-secrets.sh --self-test
          bash scripts/ci/check-tracked-secrets.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck (production code AND specs/e2e — ts-jest does not type-check them)
        run: npm run typecheck

      # Problems on ADDED lines only, quality rules only: the tree carries ~15,700 prettier errors (mostly
      # CRLF) and ~77 older rule errors that a whole-tree or whole-file gate would trip on. See scripts/ci/lint-changed.mjs.
      - name: Lint added lines (check only — never --fix in CI)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD~1"
          fi
          node scripts/ci/lint-changed.mjs "$base"

      - name: Dependency advisories (production deps; adjudicated allow-list in the script)
        run: node scripts/check-npm-audit.js

      - name: Secret scan of the commits under review
        env:
          # PR: base..head. workflow_call from a push: the pushed range. Anything else: just HEAD.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range="HEAD~1..HEAD"
          if [ -n "${BASE_SHA:-}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..HEAD"
          fi
          echo "scanning ${range}"
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git --log-opts="${range}" --redact --no-banner --verbose /repo

  # ── Unit + integration + migration chain ───────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ziyarati_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: ziyarati_ci
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ziyarati_ci
      REDIS_URL: redis://127.0.0.1:63790
      REDIS_TEST_URL: redis://127.0.0.1:63790
      # pgvector.int-spec.ts creates its own throw-away database on this server. Without it the spec returned
      # early and the AI knowledge-base integration tests passed having run nothing; with CI=true it now fails
      # instead of skipping (test/utils/require-infra.ts).
      PGVECTOR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      JWT_ACCESS_SECRET: backend-ci-access-secret-not-for-production-use
      JWT_REFRESH_SECRET: backend-ci-refresh-secret-not-for-production-use
      PAYMENT_PROVIDER: noop
      EMAIL_ENABLED: "false"
      # Inert placeholders (no provider is reachable with them; OPENAI_API_KEY stays UNSET on purpose):
      # specs that handle stored provider credentials or build the Meta config need a key to exist.
      CREDENTIALS_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      META_APP_ID: "000000000000000"
      META_APP_SECRET: ci-placeholder-meta-app-secret
      META_WEBHOOK_VERIFY_TOKEN: ci-placeholder-verify-token
      META_EMBEDDED_SIGNUP_CONFIG_ID: "000000000000000"
      # Fail (instead of silently skipping) when Docker/Testcontainers is missing.
      REQUIRE_TESTCONTAINERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Redis on the port the specs default to (also what the Redis-outage specs `docker stop`).
      - name: Start Redis (zt-e2e-redis :63790)
        run: |
          docker run -d --name zt-e2e-redis -p 63790:6379 redis:7-alpine
          bash scripts/ci/wait-for-redis.sh zt-e2e-redis 63790 30

      - name: Build
        run: npm run build

      - name: pgvector is available on the CI Postgres (fail here, not in an AI spec)
        run: node scripts/ci/require-pgvector.js pre

      - name: Provision the CI database from the migration chain
        run: node node_modules/typeorm/cli.js migration:run -d dist/src/config/data-source.js

      - name: AI vector schema exists after the migration chain (extension, ai_kb_embeddings, indexes)
        run: node scripts/ci/require-pgvector.js post

      - name: Unit tests (with coverage)
        run: npx jest --ci --coverage

      # Report-only: 80% lines/branches on money, identity, tenancy and scheduling code is the RECOMMENDED bar
      # (owner decision D13 turns it into a gate with COVERAGE_ENFORCE=1).
      - name: Coverage on critical modules
        run: npm run coverage:report

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/
          retention-days: 14

      - name: Integration tests (real Postgres/Redis; test/integration/*.int-spec.ts)
        run: npm run test:integration -- --testPathIgnorePatterns "redis-resilience"

      # Testcontainers restarts/blackholes a Redis container. Its failures (ECONNREFUSED on the
      # container's port) were a spec defect, not a host quirk: Docker re-assigns the published port on
      # every restart and the spec kept the pre-restart URL — fixed 2026-10-23 (5/5 green on Docker
      # Desktop). It has not yet run on a Linux runner, so this stays informational until a first CI
      # run is green; then drop `continue-on-error`.
      - name: Redis resilience (Testcontainers) — informational
        continue-on-error: true
        run: npm run test:integration -- redis-resilience

      - name: Migration chain from empty, with up/down/up checks
        run: npm run migration:verify

      # The security specs that need no harness/database: route-authorization allow-list, config
      # invariants, constant-time comparisons, CSWSH handshake, env isolation, route manifest. Anything that
      # boots AppModule (ai-w10-quota-failclosed included) needs the `ziyarati_e2e` database, which only the
      # gating `ai-security` job below provisions — it must NOT be listed here (src/config/ci-workflow-redis.spec.ts
      # fails if a harness/AppModule spec is added to this list).
      - name: Security invariants (infrastructure-free)
        run: >-
          npx jest --config ./test/jest-security.json --ci --forceExit
          --testPathPatterns "test/security/(ai-d5-ws-rate-limit-degraded|ai-w5-embedding-cache-key|config-invariants|e2e-env-invariants|nest-route-metadata|route-authorization|route-manifest|ws-cswsh-handshake)\.spec\.ts$"

  # ── Real-app e2e (HTTP, auth, tenancy, payments with a fake Tap, webhooks) ─
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ziyarati_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: ziyarati_e2e
      E2E_DB_NAME: ziyarati_e2e
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ziyarati_e2e
      ZT_E2E_REDIS_URL: redis://127.0.0.1:63790
      REDIS_URL: redis://127.0.0.1:63790
      JWT_ACCESS_SECRET: backend-ci-access-secret-not-for-production-use
      JWT_REFRESH_SECRET: backend-ci-refresh-secret-not-for-production-use
      PAYMENT_PROVIDER: noop
      EMAIL_ENABLED: "false"
      # Inert placeholders (no provider is reachable with them; OPENAI_API_KEY stays UNSET on purpose):
      # specs that handle stored provider credentials or build the Meta config need a key to exist.
      CREDENTIALS_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      META_APP_ID: "000000000000000"
      META_APP_SECRET: ci-placeholder-meta-app-secret
      META_WEBHOOK_VERIFY_TOKEN: ci-placeholder-verify-token
      META_EMBEDDED_SIGNUP_CONFIG_ID: "000000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Start Redis (zt-e2e-redis :63790 — the Redis-outage specs stop/start this container)
        run: |
          docker run -d --name zt-e2e-redis -p 63790:6379 redis:7-alpine
          bash scripts/ci/wait-for-redis.sh zt-e2e-redis 63790 30

      - name: Build
        run: npm run build

      - name: pgvector is available on the CI Postgres (fail here, not in an AI spec)
        run: node scripts/ci/require-pgvector.js pre

      - name: Provision the database from the migration chain, then seed the RBAC catalogue + platform admin
        run: |
          node node_modules/typeorm/cli.js migration:run -d dist/src/config/data-source.js
          npm run seed
          node scripts/ci/require-pgvector.js post

      # database-tls needs a hand-built TLS Postgres (docs/SECURITY_DATASTORE_PRODUCTION.md §4) and
      # integration-platform has its own config (next step). Everything else gates: the 15 suites that were
      # red at the Phase 0 baseline (stale fixtures after deliberate product changes) were repaired in Phase 3,
      # so there is no longer an informational split.
      # One Jest process per shard, run back to back (still --runInBand: the suites share one database and the
      # Redis-outage specs stop the shared Redis container, so they must not overlap). 106 suites in ONE process
      # grow the heap ~40 MB per suite (Jest keeps each suite's module graph alive in a long --runInBand run):
      # 3.98 GB of a 4 GB limit by the last suite, an out-of-memory abort (exit 134) at the 2 GB default of a
      # 7 GB machine, and late suites starved into `timeout exceeded when trying to connect`. A separate process
      # per shard returns that memory. EVERY shard must pass: the loop runs them all (so one red shard still
      # shows the others) and exits non-zero if any failed.
      - name: e2e suite (all suites except database-tls and integration-platform; sequential shards)
        run: |
          rc=0
          for shard in 1 2 3 4; do
            echo "::group::e2e shard ${shard}/4"
            npx jest --config ./test/jest-e2e.json --runInBand --ci --forceExit --shard="${shard}/4" \
              --testPathIgnorePatterns "database-tls\.e2e-spec\.ts$|integration-platform\.e2e-spec\.ts$" || rc=$?
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Integration-platform e2e suite
        run: npx jest --config ./test/jest-e2e-integration-platform.json --ci

  # ── AI security harness (default mode = PLAIN Postgres; pgvector mode = Postgres on 5434) ─────────
  # 95 specs boot the real app against a database. They share ONE database and use fixed seed data, so they
  # MUST run in band (--runInBand): in parallel they collide on unique keys / the appointment-overlap
  # constraint and on the Redis-outage specs that stop the shared Redis container. Default-mode specs assert
  # that pgvector is ABSENT (the keyword-fallback path), so the main database must be plain Postgres; the
  # specs that need pgvector use the second server on 5434, hard-wired in test/security/fixtures/ai-audit-harness.ts.
  ai-security:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17 # plain on purpose (default-mode specs assert pgvector is ABSENT); same major as production
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ziyarati_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: ziyarati_e2e
      E2E_DB_NAME: ziyarati_e2e
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ziyarati_e2e
      ZT_E2E_REDIS_URL: redis://127.0.0.1:63790
      REDIS_URL: redis://127.0.0.1:63790
      JWT_ACCESS_SECRET: backend-ci-access-secret-not-for-production-use
      JWT_REFRESH_SECRET: backend-ci-refresh-secret-not-for-production-use
      PAYMENT_PROVIDER: noop
      EMAIL_ENABLED: "false"
      # Inert placeholders for specs that construct Meta / encryption config. No provider is reachable:
      # nothing here is a real credential. OPENAI_API_KEY stays UNSET (the harness injects a canary).
      META_APP_ID: "000000000000000"
      META_APP_SECRET: ci-placeholder-meta-app-secret
      META_WEBHOOK_VERIFY_TOKEN: ci-placeholder-verify-token
      META_EMBEDDED_SIGNUP_CONFIG_ID: "000000000000000"
      CREDENTIALS_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Start Redis (zt-e2e-redis :63790)
        run: |
          docker run -d --name zt-e2e-redis -p 63790:6379 redis:7-alpine
          bash scripts/ci/wait-for-redis.sh zt-e2e-redis 63790 30

      - name: Build
        run: npm run build

      - name: Server roles are what the specs assume (5432 plain, 5434 pgvector)
        run: |
          node scripts/ci/require-pgvector.js pre --expect absent
          node scripts/ci/require-pgvector.js pre --port 5434 --database postgres

      - name: Provision the default-mode database (plain Postgres) from migrations and seed it
        run: |
          node node_modules/typeorm/cli.js migration:run -d dist/src/config/data-source.js
          npm run seed

      - name: Provision the pgvector-mode database (16-dim embeddings, port 5434) from migrations and seed it
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -c "CREATE EXTENSION IF NOT EXISTS vector"
          PGVECTOR_DB_HOST=127.0.0.1 PGVECTOR_DB_PORT=5434 node test/security/fixtures/provision-pgvector-db.js
          node scripts/ci/require-pgvector.js post --port 5434

      - name: AI security suite (harness-based, in band)
        run: npx jest --config ./test/jest-security.json --ci --runInBand --forceExit

  # ── Deterministic AI audit (needs pgvector on its MAIN database: det-06 exercises vector retrieval) ──
  ai-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ziyarati_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: ziyarati_e2e
      E2E_DB_NAME: ziyarati_e2e
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ziyarati_e2e
      ZT_E2E_REDIS_URL: redis://127.0.0.1:63790
      REDIS_URL: redis://127.0.0.1:63790
      JWT_ACCESS_SECRET: backend-ci-access-secret-not-for-production-use
      JWT_REFRESH_SECRET: backend-ci-refresh-secret-not-for-production-use
      PAYMENT_PROVIDER: noop
      EMAIL_ENABLED: "false"
      META_APP_ID: "000000000000000"
      META_APP_SECRET: ci-placeholder-meta-app-secret
      META_WEBHOOK_VERIFY_TOKEN: ci-placeholder-verify-token
      META_EMBEDDED_SIGNUP_CONFIG_ID: "000000000000000"
      CREDENTIALS_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start Redis (zt-e2e-redis :63790)
        run: |
          docker run -d --name zt-e2e-redis -p 63790:6379 redis:7-alpine
          bash scripts/ci/wait-for-redis.sh zt-e2e-redis 63790 30
      - name: Build
        run: npm run build
      - name: pgvector is available on the CI Postgres (fail here, not in an AI spec)
        run: node scripts/ci/require-pgvector.js pre
      - name: Provision the database from migrations and seed it
        run: |
          node node_modules/typeorm/cli.js migration:run -d dist/src/config/data-source.js
          npm run seed
          node scripts/ci/require-pgvector.js post
      - name: AI audit suite (deterministic, in band)
        run: npm run test:ai-audit -- --forceExit
