name: Backend CI

# The backend's quality gate.
#
#   - pull_request  -> required check on every PR into master.
#   - workflow_call -> deploy-aws.yml calls this and `deploy-production` WAITS for it, so a
#                      production deploy cannot start from a commit that has not passed it.
#
# Before this workflow existed the only thing between a push and production was `npx jest`
# (deploy-aws.yml); the e2e, security and dependency gates lived in the FRONTEND repo's CI and
# never ran for backend changes. Everything here is real infrastructure (pgvector Postgres 17 +
# Redis 7, the same major versions as production) built from the migration chain — never
# `synchronize` — with no provider credentials: payments are `noop`, email is disabled, and no
# OPENAI_API_KEY is ever set, so no job can reach a live provider.
#
# Branch protection (repo settings, owner): require `static`, `unit`, `e2e` and `security`
# on master. Until then this workflow only reports.

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "infra/**"
      - "compliance/**"
      - "docs/**"
      - "**/*.md"
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: "24" # engines >=22; the production image is node 24
# The Postgres service image is pgvector/pgvector:pg17 in every job below: the AI migrations need
# the `vector` extension, exactly as on RDS. The credentials are for disposable CI databases.

jobs:
  # ── Fast checks: nothing here needs a database ─────────────────────────────
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan below needs the commit range

      - name: No credential-bearing files are tracked (state files, saved plans, keys, .env)
        run: |
          bash scripts/ci/check-tracked-secrets.sh --self-test
          bash scripts/ci/check-tracked-secrets.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck (production code AND specs/e2e — ts-jest does not type-check them)
        run: npm run typecheck

      # Problems on ADDED lines only, quality rules only: the tree carries ~15,700 prettier errors (mostly
      # CRLF) and ~77 older rule errors that a whole-tree or whole-file gate would trip on. See scripts/ci/lint-changed.mjs.
      - name: Lint added lines (check only — never --fix in CI)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="HEAD~1"
          fi
          node scripts/ci/lint-changed.mjs "$base"

      - name: Dependency advisories (production deps; adjudicated allow-list in the script)
        run: node scripts/check-npm-audit.js

      - name: Secret scan of the commits under review
        env:
          # PR: base..head. workflow_call from a push: the pushed range. Anything else: just HEAD.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range="HEAD~1..HEAD"
          if [ -n "${BASE_SHA:-}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..HEAD"
          fi
          echo "scanning ${range}"
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git --log-opts="${range}" --redact --no-banner --verbose /repo

  # ── Unit + integration + migration chain ───────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ziyarati_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: ziyarati_ci
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ziyarati_ci
      REDIS_URL: redis://127.0.0.1:63790
      REDIS_TEST_URL: redis://127.0.0.1:63790
      JWT_ACCESS_SECRET: backend-ci-access-secret-not-for-production-use
      JWT_REFRESH_SECRET: backend-ci-refresh-secret-not-for-production-use
      PAYMENT_PROVIDER: noop
      EMAIL_ENABLED: "false"
      # Inert placeholders (no provider is reachable with them; OPENAI_API_KEY stays UNSET on purpose):
      # specs that handle stored provider credentials or build the Meta config need a key to exist.
      CREDENTIALS_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      META_APP_ID: "000000000000000"
      META_APP_SECRET: ci-placeholder-meta-app-secret
      META_WEBHOOK_VERIFY_TOKEN: ci-placeholder-verify-token
      META_EMBEDDED_SIGNUP_CONFIG_ID: "000000000000000"
      # Fail (instead of silently skipping) when Docker/Testcontainers is missing.
      REQUIRE_TESTCONTAINERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Redis on the port the specs default to (also what the Redis-outage specs `docker stop`).
      - name: Start Redis (zt-e2e-redis :63790)
        run: |
          docker run -d --name zt-e2e-redis -p 63790:6379 redis:7-alpine
          for i in $(seq 1 30); do
            [ "$(docker exec zt-e2e-redis redis-cli ping 2>/dev/null)" = "PONG" ] && exit 0
            sleep 1
          done
          echo "::error::Redis did not become ready"; exit 1

      - name: Build
        run: npm run build

      - name: Provision the CI database from the migration chain
        run: node node_modules/typeorm/cli.js migration:run -d dist/src/config/data-source.js

      - name: Unit tests
        run: npx jest --ci

      - name: Integration tests (real Postgres/Redis; test/integration/*.int-spec.ts)
        run: npm run test:integration -- --testPathIgnorePatterns "redis-resilience"

      # Testcontainers restarts/blackholes a Redis container. 3 of its tests failed on a Windows
      # Docker Desktop host (2026-10-23) and have never been observed on Linux CI, so this is
      # informational until a first CI run shows it is stable; then drop `continue-on-error`.
      - name: Redis resilience (Testcontainers) — informational
        continue-on-error: true
        run: npm run test:integration -- redis-resilience

      - name: Migration chain from empty, with up/down/up checks
        run: npm run migration:verify

      # The security specs that need no harness/database: route-authorization allow-list, config
      # invariants, constant-time comparisons, CSWSH handshake, env isolation. The 87 harness-based
      # AI specs run in the informational `ai-security` job below.
      - name: Security invariants (infrastructure-free)
        run: >-
          npx jest --config ./test/jest-security.json --ci --forceExit
          --testPathPatterns "test/security/(ai-d5-ws-rate-limit-degraded|ai-w10-quota-failclosed|ai-w5-embedding-cache-key|config-invariants|e2e-env-invariants|nest-route-metadata|route-authorization|ws-cswsh-handshake)\.spec\.ts$"

  # ── Real-app e2e (HTTP, auth, tenancy, payments with a fake Tap, webhooks) ─
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ziyarati_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: ziyarati_e2e
      E2E_DB_NAME: ziyarati_e2e
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ziyarati_e2e
      ZT_E2E_REDIS_URL: redis://127.0.0.1:63790
      REDIS_URL: redis://127.0.0.1:63790
      JWT_ACCESS_SECRET: backend-ci-access-secret-not-for-production-use
      JWT_REFRESH_SECRET: backend-ci-refresh-secret-not-for-production-use
      PAYMENT_PROVIDER: noop
      EMAIL_ENABLED: "false"
      # Inert placeholders (no provider is reachable with them; OPENAI_API_KEY stays UNSET on purpose):
      # specs that handle stored provider credentials or build the Meta config need a key to exist.
      CREDENTIALS_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      META_APP_ID: "000000000000000"
      META_APP_SECRET: ci-placeholder-meta-app-secret
      META_WEBHOOK_VERIFY_TOKEN: ci-placeholder-verify-token
      META_EMBEDDED_SIGNUP_CONFIG_ID: "000000000000000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Start Redis (zt-e2e-redis :63790 — the Redis-outage specs stop/start this container)
        run: |
          docker run -d --name zt-e2e-redis -p 63790:6379 redis:7-alpine
          for i in $(seq 1 30); do
            [ "$(docker exec zt-e2e-redis redis-cli ping 2>/dev/null)" = "PONG" ] && exit 0
            sleep 1
          done
          echo "::error::Redis did not become ready"; exit 1

      - name: Build
        run: npm run build

      - name: Provision the database from the migration chain, then seed the RBAC catalogue + platform admin
        run: |
          node node_modules/typeorm/cli.js migration:run -d dist/src/config/data-source.js
          npm run seed

      # Measured 2026-10-23 on a migration-built database: 103 suites / 1,637 tests; 87 suites passed
      # and 16 failed (77 tests). Repairing `health-readiness` (a hard-coded Redis URL) since moved one
      # across: the 88 passing suites GATE, and the 15 below are informational — their causes (stale
      # fixtures/expectations after deliberate product changes, teardown ordering) are in
      # docs/quality/2026-10-23-phase0-baseline.md §2. Phase 3 repairs them and deletes this split.
      # database-tls needs a hand-built TLS Postgres (docs/SECURITY_DATASTORE_PRODUCTION.md §4) and
      # integration-platform has its own config (next step).
      - name: e2e suite (88 passing suites — gating)
        run: >-
          npx jest --config ./test/jest-e2e.json --runInBand --ci --forceExit
          --testPathIgnorePatterns "database-tls\.e2e-spec\.ts$|integration-platform\.e2e-spec\.ts$|activity-log-workflow|appointment-availability|processor-dlq|whatsapp-dlq|clinical-entry-revisions|email-campaign|integration-audit\.e2e|tenant-settings|whatsapp-tech-provider|tenant-targets|booking-payment\.tap|waitlist-offer|appointment-query-count|auth-abuse-forgot-password|analytics-journey\.e2e"

      - name: e2e suites with known failures (15) — informational
        continue-on-error: true
        run: >-
          npx jest --config ./test/jest-e2e.json --runInBand --ci --forceExit
          --testPathPatterns "(activity-log-workflow|appointment-availability|processor-dlq|whatsapp-dlq|clinical-entry-revisions|email-campaign|integration-audit\.e2e|tenant-settings|whatsapp-tech-provider|tenant-targets|booking-payment\.tap|waitlist-offer|appointment-query-count|auth-abuse-forgot-password|analytics-journey\.e2e)"

      - name: Integration-platform e2e suite
        run: npx jest --config ./test/jest-e2e-integration-platform.json --ci

  # ── AI security harness + deterministic AI audit — INFORMATIONAL until Phase 3 ──
  # 87 specs boot the real app against a database and need the topology the harness was designed
  # for: a PLAIN Postgres for default mode and a separate pgvector Postgres on 5434 for
  # pgvector mode (test/security/fixtures/HARNESS_GUIDE.md, provision-pgvector-db.js). The first
  # measured run (2026-10-23, local, no credentials) passes 545 of 580 tests; the remainder are
  # stale expectations after deliberate product changes, specs that read S3 / Meta / OpenAI settings
  # a developer .env supplied, and two candidate findings (docs/quality). Until those are repaired
  # this job REPORTS but does not block: `continue-on-error`. Making it required is a Phase 3 task.
  # The infrastructure-free security invariants DO gate: see the `unit` job.
  ai-security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ziyarati
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5434:5432"] # hard-wired in test/security/fixtures/ai-audit-harness.ts
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: ziyarati_e2e
      E2E_DB_NAME: ziyarati_e2e
      E2E_RBAC_SOURCE_DB: ziyarati
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ziyarati_e2e
      ZT_E2E_REDIS_URL: redis://127.0.0.1:63790
      REDIS_URL: redis://127.0.0.1:63790
      JWT_ACCESS_SECRET: backend-ci-access-secret-not-for-production-use
      JWT_REFRESH_SECRET: backend-ci-refresh-secret-not-for-production-use
      PAYMENT_PROVIDER: noop
      EMAIL_ENABLED: "false"
      # Inert placeholders for specs that construct Meta / encryption config. No provider is reachable:
      # nothing here is a real credential, and OPENAI_API_KEY stays UNSET on purpose.
      META_APP_ID: "000000000000000"
      META_APP_SECRET: ci-placeholder-meta-app-secret
      META_WEBHOOK_VERIFY_TOKEN: ci-placeholder-verify-token
      META_EMBEDDED_SIGNUP_CONFIG_ID: "000000000000000"
      CREDENTIALS_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Start Redis (zt-e2e-redis :63790)
        run: |
          docker run -d --name zt-e2e-redis -p 63790:6379 redis:7-alpine
          for i in $(seq 1 30); do
            [ "$(docker exec zt-e2e-redis redis-cli ping 2>/dev/null)" = "PONG" ] && exit 0
            sleep 1
          done
          echo "::error::Redis did not become ready"; exit 1

      - name: Build
        run: npm run build

      - name: Provision both databases from the migration chain (plain Postgres) and seed
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE ziyarati_e2e"
          for db in ziyarati ziyarati_e2e; do
            DB_NAME=$db DATABASE_URL="postgres://postgres:postgres@localhost:5432/$db"               node node_modules/typeorm/cli.js migration:run -d dist/src/config/data-source.js
            DB_NAME=$db DATABASE_URL="postgres://postgres:postgres@localhost:5432/$db" npm run seed
          done

      - name: Provision the pgvector-mode database (16-dim embeddings, port 5434)
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5434 -U postgres -c "CREATE EXTENSION IF NOT EXISTS vector"
          PGVECTOR_DB_HOST=127.0.0.1 PGVECTOR_DB_PORT=5434 node test/security/fixtures/provision-pgvector-db.js

      - name: AI security suite (harness-based)
        run: npx jest --config ./test/jest-security.json --ci --forceExit

      - name: AI audit suite (deterministic)
        run: npm run test:ai-audit -- --forceExit
