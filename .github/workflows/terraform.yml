name: Terraform

# infra/docs/TERRAFORM.md. fmt → validate → test (mocked AWS) on every PR;
# plan per environment with the READ-ONLY role; apply only by manual dispatch
# from the protected `infra-<env>` GitHub Environment (required reviewers).
# NEVER applies on push or pull_request. Only a production stack exists today, so plan
# and apply are production-only; re-add `staging` here when a staging stack exists.

on:
  pull_request:
    paths: ["infra/terraform/**", "infra/scripts/**", "compliance/**", ".github/workflows/terraform.yml"]
  push:
    branches: [master]
    paths: ["infra/terraform/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to APPLY"
        type: choice
        options: [production]
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  TF_IN_AUTOMATION: "1"
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Single-region platform: infra/scripts/region-gate.sh refuses any other region.
  PLATFORM_REGION: eu-central-1
  TF_VERSION: "1.16.4"

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: region gate (no region literals; tfvars consistent)
        run: bash infra/scripts/region-gate.sh static
      - name: validate roots
        run: |
          for d in bootstrap environments/staging environments/production environments/org-guardrails; do
            terraform -chdir="infra/terraform/$d" init -backend=false -input=false
            terraform -chdir="infra/terraform/$d" validate
          done
      - name: IaC security scan (HIGH/CRITICAL fail the build)
        run: |
          docker run --rm -v "$PWD/infra/terraform:/src:ro" aquasec/trivy:0.57.1 config /src --ignorefile /src/.trivyignore.yaml \
            --severity HIGH,CRITICAL --exit-code 1 --skip-dirs "**/.terraform" --skip-files "**/*.tftest.hcl"
      - name: terraform test (mocked AWS — no account needed)
        run: |
          for m in network rds elasticache s3-uploads ecs waf kms backup secrets ecr alb account-baseline platform github-deploy org-guardrails/policies org-guardrails log-protection; do
            terraform -chdir="infra/terraform/modules/$m" init -backend=false -input=false
            terraform -chdir="infra/terraform/modules/$m" test
          done

      - name: SCP semantics (rendered service control policies evaluated against concrete API requests)
        run: node --test infra/scripts/tests/scp-semantics.test.cjs

      - name: deploy-image verifier (offline test of the gate that proves ECS runs the pushed image)
        run: bash infra/scripts/tests/verify-deployed-image.test.sh

      - name: ECR scan gate (offline test of scan polling, failure reporting and the CRITICAL policy)
        run: bash infra/scripts/tests/ecr-scan-gate.test.sh

      - name: production gate (manifest well formed; checker tested offline)
        run: |
          node infra/scripts/production-gate.cjs validate
          node --test infra/scripts/tests/production-gate.test.cjs

  plan:
    needs: static
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: [production]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: region gate (a region must be approved before any plan or apply)
        run: bash infra/scripts/region-gate.sh deploy ${{ matrix.environment }}
      - name: Account id
        id: acct
        run: |
          if [ "${{ matrix.environment }}" = production ]; then
            echo "id=${{ vars.AWS_ACCOUNT_ID_PRODUCTION }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${{ vars.AWS_ACCOUNT_ID_STAGING }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.acct.outputs.id }}:role/zt-${{ matrix.environment }}-tf-plan
          aws-region: ${{ env.AWS_REGION }}
      - name: plan
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        env:
          TF_VAR_account_id: ${{ steps.acct.outputs.id }}
        run: |
          terraform init -input=false -backend-config="bucket=zt-${{ matrix.environment }}-tfstate-${{ steps.acct.outputs.id }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="key=platform/${{ env.AWS_REGION }}/terraform.tfstate"
          terraform plan -input=false -lock=false -no-color -out=tfplan | tee plan.txt
          {
            echo "### terraform plan — ${{ matrix.environment }}"
            echo '```'
            grep -E '^Plan:|No changes' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Reviewers must approve what will change, not a blank check: the plan is
  # produced BEFORE the environment gate (read-only role, no lock, no artifact —
  # a saved plan file would carry the Valkey AUTH token), the diff is shown in
  # the run summary, and the gated job re-plans and refuses to apply if the
  # change set differs from what was reviewed.
  preview:
    needs: static
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      summary: ${{ steps.plan.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: region gate (a region must be approved before any plan or apply)
        run: bash infra/scripts/region-gate.sh deploy ${{ inputs.environment }}
      - name: production gate (every legal / document item evidenced; technical items still present in CI)
        run: node infra/scripts/production-gate.cjs enforce
      - name: Account id
        id: acct
        run: |
          if [ "${{ inputs.environment }}" = production ]; then
            echo "id=${{ vars.AWS_ACCOUNT_ID_PRODUCTION }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${{ vars.AWS_ACCOUNT_ID_STAGING }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.acct.outputs.id }}:role/zt-${{ inputs.environment }}-tf-plan
          aws-region: ${{ env.AWS_REGION }}
      - name: plan (read-only)
        id: plan
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        env:
          TF_VAR_account_id: ${{ steps.acct.outputs.id }}
        run: |
          terraform init -input=false -backend-config="bucket=zt-${{ inputs.environment }}-tfstate-${{ steps.acct.outputs.id }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="key=platform/${{ env.AWS_REGION }}/terraform.tfstate"
          terraform plan -input=false -lock=false -no-color | tee plan.txt
          SUMMARY="$(grep -E '^Plan:|^No changes' plan.txt | head -1 || true)"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          {
            echo "### Review before approving — ${{ inputs.environment }}"
            echo '```'
            grep -E '^  [#~+-]|^Plan:|^No changes|must be replaced|will be destroyed' plan.txt | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: [static, preview]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150 # first apply waits for ACM DNS validation
    environment: infra-${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: region gate (a region must be approved before any plan or apply)
        run: bash infra/scripts/region-gate.sh deploy ${{ inputs.environment }}
      - name: production gate (every legal / document item evidenced; technical items still present in CI)
        run: node infra/scripts/production-gate.cjs enforce
      - name: Account id
        id: acct
        run: |
          if [ "${{ inputs.environment }}" = production ]; then
            echo "id=${{ vars.AWS_ACCOUNT_ID_PRODUCTION }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${{ vars.AWS_ACCOUNT_ID_STAGING }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.acct.outputs.id }}:role/zt-${{ inputs.environment }}-tf-apply
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - name: plan, verify it matches the reviewed preview, apply
        working-directory: infra/terraform/environments/${{ inputs.environment }}
        env:
          TF_VAR_account_id: ${{ steps.acct.outputs.id }}
          REVIEWED: ${{ needs.preview.outputs.summary }}
        run: |
          terraform init -input=false -backend-config="bucket=zt-${{ inputs.environment }}-tfstate-${{ steps.acct.outputs.id }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="key=platform/${{ env.AWS_REGION }}/terraform.tfstate"
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          NOW="$(grep -E '^Plan:|^No changes' plan.txt | head -1 || true)"
          if [ "$NOW" != "$REVIEWED" ]; then
            echo "::error::The change set differs from the one reviewed (reviewed: '${REVIEWED}', now: '${NOW}'). Re-run the workflow and review again."
            exit 1
          fi
          terraform apply -input=false tfplan
