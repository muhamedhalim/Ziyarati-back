name: Deploy backend (AWS)

# infra/docs/DEPLOYMENT.md. Keyless: GitHub OIDC → zt-production-github-deploy.
#
# PRODUCTION ONLY. There is no staging stack today (no zt-staging cluster, role or
# account variables), so the former "deploy-staging" gate was removed instead of
# being left to fail and silently block every production deploy. Production is
# still gated by (1) the unit-test job and (2) the required reviewer on the
# `production` GitHub Environment. If a staging stack is built later, re-add a
# staging job in front of `deploy-production`.
#
# Flow:  pull request → build + typecheck + tests + image (VALIDATION ONLY — no AWS access, no deploy)
#        push to master → build + typecheck + tests + image → preflight
#        → [reviewer approves `production`] → push SHA tag to ECR (immutable)
#        → ecs-deploy.sh (scan gate, migrate, roll, wait-ecs-rollout.sh = bounded wait for
#          PRIMARY+COMPLETED, rollback check, image check, smoke)
#          → verify-deployed-image.sh (ECS runs exactly this image).
# Rollback = run this workflow manually with image_tag=<previous sha>.
#
# Repository variables (Settings → Variables; none are secrets) — preflight
# fails with the names of any that are missing:
#   AWS_REGION, AWS_ACCOUNT_ID_PRODUCTION, API_URL_PRODUCTION
# Optional:
#   ALLOW_CRITICAL_IMAGE_FINDINGS ("true" downgrades the CRITICAL-CVE gate to a warning)

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "infra/**"
      - "compliance/**"
      - "docs/**"
      - "**/*.md"
      # Sibling workflows are not part of the backend image.
      - ".github/workflows/terraform.yml"
      - ".github/workflows/ai-audit.yml"
  push:
    branches: [master]
    paths-ignore:
      - "infra/**"
      - "compliance/**"
      - "docs/**"
      - "**/*.md"
      # Sibling workflows are not part of the backend image.
      - ".github/workflows/terraform.yml"
      - ".github/workflows/ai-audit.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ROLLBACK: redeploy an EXISTING image tag (git sha) — skips build and tests. Empty = build and test this commit."
        required: false
        default: ""

permissions:
  contents: read # everything below; only deploy-production adds id-token for OIDC

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Single-region platform: the preflight job refuses any other region.
  PLATFORM_REGION: eu-central-1
  ECR_REPOSITORY: ziyaratech/backend

jobs:
  preflight:
    # Deploys only ever come from master pushes or manual runs on master — never from a pull request.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required repository variables are set
        env:
          V_REGION: ${{ vars.AWS_REGION }}
          V_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID_PRODUCTION }}
          V_API_URL: ${{ vars.API_URL_PRODUCTION }}
        run: |
          missing=""
          [ -n "$V_REGION" ]  || missing="$missing AWS_REGION"
          [ -n "$V_ACCOUNT" ] || missing="$missing AWS_ACCOUNT_ID_PRODUCTION"
          [ -n "$V_API_URL" ] || missing="$missing API_URL_PRODUCTION"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:${missing}. Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [ "$V_REGION" != "$PLATFORM_REGION" ]; then
            echo "::error::AWS_REGION is '$V_REGION' but the platform runs only in $PLATFORM_REGION. Refusing to deploy."
            exit 1
          fi
          case "$V_API_URL" in https://*) ;; *) echo "::error::API_URL_PRODUCTION must start with https://"; exit 1;; esac

  build:
    # Pull requests and master pushes build and test; a manual rollback (image_tag) skips it.
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }} # superseded PR pushes are cancelled; master builds are not

    # Real Postgres for the database-backed specs (analytics conformance, patient journey).
    # pgvector image: the AI migrations need the `vector` extension (same as production RDS).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ziyarati_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: ziyarati_ci
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ziyarati_ci # disposable CI database, not a secret
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck + build
        run: npm run build

      - name: Provision the CI database from the migration chain
        run: node node_modules/typeorm/cli.js migration:run -d dist/src/config/data-source.js

      - name: Tests (no bypass - any failure stops the pipeline before AWS is touched)
        run: npx jest --ci

      - id: tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          # --provenance=false --sbom=false: recent Docker emits an OCI image INDEX (image +
          # attestation manifest) by default. ECR basic scanning cannot scan an index, which
          # makes scripts/ecs-deploy.sh's vulnerability gate fail. Push a single-manifest image.
          # APP_REVISION: the commit the image was built from, stamped into every log
          # line (`version`), the /health body and the X-App-Revision header.
          docker build --provenance=false --sbom=false --build-arg "APP_REVISION=${GITHUB_SHA}" -t "backend:${GITHUB_SHA}" .
          # The image must not contain environment files.
          if docker run --rm --entrypoint sh "backend:${GITHUB_SHA}" -c 'ls -a /app | grep -E "^\.env"'; then
            echo "::error::.env file found inside the image"; exit 1
          fi
          test "$(docker run --rm --entrypoint sh "backend:${GITHUB_SHA}" -c 'test -s /app/certs/rds-global-bundle.pem && echo ok')" = ok
          docker save "backend:${GITHUB_SHA}" | gzip -1 > image.tar.gz

      - if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: image.tar.gz
          retention-days: 7

  # The full quality gate (backend-ci.yml: secret/tracked-file guard, typecheck incl. specs, lint,
  # dependency advisories, unit + integration + migration chain, e2e, security + AI audit) for THIS
  # commit. Pull requests run backend-ci.yml directly, so it is skipped here for them; a manual
  # rollback (image_tag) redeploys an already-tested image and skips it, like the build.
  quality:
    if: ${{ github.event_name != 'pull_request' && inputs.image_tag == '' }}
    uses: ./.github/workflows/backend-ci.yml

  deploy-production:
    needs: [preflight, build, quality]
    # Runs after a successful build AND quality gate, or — for a manual rollback only — with both
    # skipped. A FAILED build or gate (red tests, failed typecheck, failed security suite) never
    # reaches here, and a pull request never does (preflight is skipped for PRs).
    if: ${{ always() && github.event_name != 'pull_request' && needs.preflight.result == 'success' && ((needs.build.result == 'success' && needs.quality.result == 'success') || (needs.build.result == 'skipped' && needs.quality.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.image_tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # ONE production deploy at a time; a second run waits (never cancelled mid-rollout, never races a rollback).
    concurrency:
      group: deploy-aws-production
      cancel-in-progress: false
    environment: production # required reviewer gate (must be configured in GitHub)
    permissions:
      contents: read
      id-token: write # OIDC → zt-production-github-deploy (trust pinned to this repo + the production Environment)
    steps:
      - uses: actions/checkout@v4

      # Residency plan section 16. Skipped for a rollback so a regressed evidence item can never
      # block recovery; `compliance/README.md`.
      - name: production gate (every legal / document item evidenced)
        if: ${{ inputs.image_tag == '' }}
        env:
          # TEMPORARY (2026-10-10, review by 2026-11-10): honour the time-boxed `deferred_*` entries in
          # compliance/production-gate.yaml. Deferred items stay `open` and are logged as warnings on every
          # run; technical items and anything not deferred still block. Delete this env block (or the
          # manifest's deferred_* lines) to restore strict enforcement. terraform.yml is intentionally NOT opted in.
          PRODUCTION_GATE_ALLOW_DEFERRALS: "true"
        run: node infra/scripts/production-gate.cjs enforce

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_PRODUCTION }}:role/zt-production-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          BUILT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          tag="${INPUT_TAG:-$BUILT_TAG}"
          # An image tag is a git sha — never a mutable name such as latest.
          if ! [[ "$tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::image tag must be a 40-character git commit SHA (got '${tag}')"; exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      - name: Push the tested image (immutable SHA tag)
        id: push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Rollback: reusing the existing image ${TAG}; nothing is pushed."
            exit 0
          fi
          # The ECR repository is IMMUTABLE. A re-run of the same commit must reuse the image that was
          # already pushed (and may already be scanned/deployed), not try to overwrite the tag.
          if aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} already exists in ECR (immutable) — reusing it instead of pushing again."
            digest="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids imageTag="${TAG}" --query 'imageDetails[0].imageDigest' --output text)"
          else
            gunzip -c image.tar.gz | docker load
            docker tag "backend:${TAG}" "${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
            docker push "${REGISTRY}/${ECR_REPOSITORY}:${TAG}" | tee push.log
            digest="$(grep -Eo 'sha256:[0-9a-f]{64}' push.log | tail -1)"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::could not determine the pushed image digest"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Migrate + deploy + verify + smoke
        env:
          # New image: block on CRITICAL findings. Redeploying an existing tag (rollback) is never blocked.
          IMAGE_SCAN_GATE: ${{ inputs.image_tag != '' && 'skip' || (vars.ALLOW_CRITICAL_IMAGE_FINDINGS == 'true' && 'warn' || 'enforce') }}
          # The digest this run pushed; ecs-deploy.sh requires ECR and ECS to agree with it.
          EXPECTED_IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          # Overall deadline for the ECS rollout wait (wait-ecs-rollout.sh). Default 900s; the old
          # `aws ecs wait` budget was 600s. Override with a repository variable only after reading a
          # real rollout duration from the [rollout] log lines; the job timeout is 45 min.
          ROLLOUT_TIMEOUT_SECONDS: ${{ vars.ECS_ROLLOUT_TIMEOUT_SECONDS || '900' }}
        run: bash infra/scripts/ecs-deploy.sh production "${{ steps.tag.outputs.tag }}" "${{ vars.API_URL_PRODUCTION }}"
