    title: "Written legal approval of the hosting location (residency plan L1/L2)"
    kind: legal
    status: open
    evidence: ""
    approved_by: ""
    date: ""
    deferred_until: "2026-11-10"
    deferred_owner: "UNASSIGNED"
    deferred_reason: "Hosting location approval needs counsel; owner accepted deploying eu-central-1 meanwhile (decision D-1, not a legal approval)."

