# Production-readiness gate manifest (residency plan section 16).
#
# Read compliance/README.md first. Short version:
#   * `open`      = nothing is evidenced yet. EVERY legal / document item below is open
#                   today, on purpose. Do not flip one without the document in hand.
#   * `satisfied` = needs `evidence`, `approved_by` and `date`. Evidence is a path in
#                   this repository, or `external: <where the document is kept>`.
#   * technical items are proven by tests, not by this file (`ci_verified`).
#
# TEMPORARY DEFERRALS (2026-10-10): the seven open legal/document items carry deferred_until /
# deferred_owner / deferred_reason. They are still `open`, still tracked, and still reported on every
# run. deploy-aws.yml opts in with PRODUCTION_GATE_ALLOW_DEFERRALS=true; terraform apply does not.
# Review by 2026-11-10 (max 90 days ahead is enforced). Assign real owners. To restore strict
# enforcement: remove the env var from deploy-aws.yml, or delete the three deferred_* lines per item.
#
# This file changes only by reviewed pull request. It is a gate on deploys; it is
# NOT a statement that the platform complies with the PDPL or any other law.
#
# Checked by infra/scripts/production-gate.cjs
#   validate  every PR (terraform.yml `static`)
#   enforce   before `terraform apply` to production and before a production image deploy
version: 1
items:
