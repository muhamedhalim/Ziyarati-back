# Prometheus for the local / verification stack.
# The app's /metrics endpoints require METRICS_TOKEN (fail-closed in
# production); the token is read from a git-ignored file, never inlined.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: ziyaratech-api
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ['api:3000']
        labels: { service: ziyaratech-api, env: local-verify }

  - job_name: ziyaratech-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ['worker:9091']
        labels: { service: ziyaratech-worker, env: local-verify }

  # Logging pipeline health.
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels: { service: loki, env: local-verify }
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
        labels: { service: alloy, env: local-verify }
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']
        labels: { service: tempo, env: local-verify }
