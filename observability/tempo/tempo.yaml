# Tempo (traces) for the local / verification stack. Receives OTLP/HTTP from
# the app when OTEL_ENABLED=true (OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # Traces are kept shorter than logs: 7 days.
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
