# ── ZT-H03 — local development infrastructure, NOT production security
# configuration ─────────────────────────────────────────────────────────────
# This file defines LOCAL / DEVELOPMENT infrastructure only.
#
#   1. The datastore credentials and settings below (postgres/postgres, and
#      Redis with no `requirepass`) must NOT be treated as production
#      security configuration — they exist so `docker compose up` gives a
#      working local stack with zero setup, nothing more.
#   2. Production PostgreSQL and Redis MUST use authenticated,
#      deployment-managed, encrypted-transport configuration — never these
#      values, never a hardcoded or default credential.
#   3. Production datastore authentication is verified using the procedure
#      in docs/SECURITY_DATASTORE_PRODUCTION.md.
#   4. No real production secret or credential is recorded in this
#      repository — this comment block included.
#
# Documentation only: no runtime value below this line is changed by this
# comment block (verified — see specs/010-security-headers-and-regression-
# suite/evidence/zt-h03-compose-config.md for the before/after rendered-
# config hash proof).
services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: ziyaratech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ziyaratech
    ports:
      - "5433:5432"
    volumes:
      - ziyaratech_postgres_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: ziyaratech-redis
    restart: unless-stopped
    # Queue-durability flags (Phase 0 — see docs/CACHING_QUEUES_AUDIT.md §0.5
    # and docs/REDIS_CAPACITY.md for the full rationale + production sizing):
    #  - appendonly/appendfsync: BullMQ job state must survive a Redis restart;
    #    without AOF, a restart loses everything back to the last RDB snapshot.
    #  - maxmemory 512mb: a DEV-SIZING EXAMPLE ONLY — noeviction is meaningless
    #    without an actual ceiling to enforce against (gap-closure pass, see
    #    docs/CACHING_QUEUES_AUDIT.md §0.8.9). Production must size this from
    #    real measured traffic via docs/REDIS_CAPACITY.md's formula, never by
    #    copying this dev default.
    #  - maxmemory-policy noeviction: this Redis holds queue state, NOT just a
    #    cache — an eviction policy would silently drop queued jobs under memory
    #    pressure instead of erroring loudly (which is what noeviction does).
    #  - notify-keyspace-events Ex: expired-key notifications, for observability
    #    tooling that wants to watch TTL'd cache/rate-limit keys expire live.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - ziyaratech_redis_data:/data

volumes:
  ziyaratech_postgres_data:
  ziyaratech_redis_data: