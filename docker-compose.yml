services:
  postgres:
    image: postgres:18
    container_name: ziyaratech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ziyaratech
    ports:
      - "5433:5432"
    volumes:
      - ziyaratech_postgres_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: ziyaratech-redis
    restart: unless-stopped
    # Queue-durability flags (Phase 0 — see docs/CACHING_QUEUES_AUDIT.md §0.5
    # and docs/REDIS_CAPACITY.md for the full rationale + production sizing):
    #  - appendonly/appendfsync: BullMQ job state must survive a Redis restart;
    #    without AOF, a restart loses everything back to the last RDB snapshot.
    #  - maxmemory 512mb: a DEV-SIZING EXAMPLE ONLY — noeviction is meaningless
    #    without an actual ceiling to enforce against (gap-closure pass, see
    #    docs/CACHING_QUEUES_AUDIT.md §0.8.9). Production must size this from
    #    real measured traffic via docs/REDIS_CAPACITY.md's formula, never by
    #    copying this dev default.
    #  - maxmemory-policy noeviction: this Redis holds queue state, NOT just a
    #    cache — an eviction policy would silently drop queued jobs under memory
    #    pressure instead of erroring loudly (which is what noeviction does).
    #  - notify-keyspace-events Ex: expired-key notifications, for observability
    #    tooling that wants to watch TTL'd cache/rate-limit keys expire live.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - ziyaratech_redis_data:/data

volumes:
  ziyaratech_postgres_data:
  ziyaratech_redis_data: